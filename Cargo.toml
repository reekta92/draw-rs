[package]
name = "draw-rs"
version = "0.1.3"
edition = "2024"
rust-version = "1.90.0"
description = "Reusable terminal drawing engine and standalone drawing application"
license = "GPL-3.0-only"
repository = "https://github.com/reekta92/draw-rs"
readme = "README.md"

[lib]
name = "draw"

[[bin]]
name = "draw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
ratatui-textarea = { version = "0.9", features = ["search"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
assigning_clones = "allow"
float_cmp = "allow"
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
doc_markdown = "allow"
format_push_string = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
inconsistent_struct_constructor = "allow"
items_after_statements = "allow"
manual_midpoint = "allow"
manual_let_else = "allow"
manual_string_new = "allow"
manual_is_variant_and = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
needless_continue = "allow"
needless_raw_string_hashes = "allow"
non_std_lazy_statics = "allow"
range_plus_one = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
