name: CI

on: [push, pull_request]

jobs:
  ci:
    uses: reekta92/.github/.github/workflows/ci.yml@746b77673ec0db7978ee464ba012cb601fcec4ef
    permissions:
      contents: read

  msrv-all-targets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
